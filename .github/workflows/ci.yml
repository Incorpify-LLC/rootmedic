name: CI

# Phase 1: on every PR, install RootMedic on a fresh VM (the GitHub-hosted
# runner itself — real systemd, destroyed automatically when the job ends,
# no cloud account or stubbing needed), inject failure scenarios, confirm it
# detects them and actually delivers alerts over Telegram and email, then
# gate the merge on all of that passing.
#
# Verification:
#   - Email: polls incorpify-email's GET /alerts/verify, which checks the
#     real inbound-mail table for the alert that was actually delivered —
#     independent of RootMedic's own "send succeeded" return value.
#   - Telegram: there is no Bot API mechanism for one bot to independently
#     observe another bot's message (a second "verifier" bot in the same
#     group never receives it — confirmed empirically, not just undocumented;
#     this isn't a privacy-mode setting, bots simply don't see other bots'
#     messages). The most that can be verified is that Telegram's own
#     sendMessage call reported success, which RootMedic's AlertManager
#     already logs — same rigor level the existing Slack/webhook channels
#     get today.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   TELEGRAM_BOT_TOKEN        - the alert-sending bot's token (from BotFather)
#   TELEGRAM_CHAT_ID          - the shared "RootMedic CI" group's chat id
#   ALERT_EMAIL_RELAY_API_KEY - incorpify-email's ALERT_RELAY_API_KEY value
#   ALERT_EMAIL_TO            - address to send/verify the test alert against

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  ALERT_EMAIL_RELAY_URL: https://incorpify-email.saneax.workers.dev
  INSTALL_DIR: /opt/rootmedic

jobs:
  install-and-verify-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR head commit
        uses: actions/checkout@v4
        with:
          # Explicit head SHA, not the default merge ref — test the PR's
          # actual commit, not a synthetic merge-with-base state.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Record job start time
        id: start
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Start Loki
        run: |
          docker run -d --name ci-loki -p 3100:3100 \
            -v "$PWD/Deployment/loki-config.yaml:/etc/loki/config.yaml:ro" \
            grafana/loki:2.9.0 -config.file=/etc/loki/config.yaml
          echo "Waiting for Loki..."
          for i in $(seq 1 30); do
            code=$(curl -fsS -o /dev/null -w "%{http_code}" --connect-timeout 3 http://localhost:3100/ready 2>/dev/null || echo 000)
            [[ "$code" == "200" ]] && echo "Loki ready." && exit 0
            sleep 2
          done
          echo "Loki never became ready." && exit 1

      - name: Start mock LLM
        run: |
          docker build -t ci-mock-llm ci/test-install/mock-llm
          docker run -d --name ci-mock-llm -p 8080:8080 ci-mock-llm
          echo "Waiting for mock LLM..."
          for i in $(seq 1 15); do
            code=$(curl -fsS -o /dev/null -w "%{http_code}" --connect-timeout 3 http://localhost:8080/ready 2>/dev/null || echo 000)
            [[ "$code" == "200" ]] && echo "Mock LLM ready." && exit 0
            sleep 2
          done
          echo "Mock LLM never became ready." && exit 1

      - name: Install RootMedic
        env:
          # Secrets and event fields never get interpolated directly into
          # script text below (GitHub's own hardening guidance) — they only
          # ever reach the shell as plain env vars.
          ROOTMEDIC_BRANCH: ${{ github.event.pull_request.head.ref }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_EMAIL_RELAY_API_KEY: ${{ secrets.ALERT_EMAIL_RELAY_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: |
          # clone_or_update_repo() takes the "update existing repo" branch
          # when INSTALL_DIR/.git already exists, then does
          # `git fetch origin <ROOTMEDIC_BRANCH> && git reset --hard origin/<branch>`
          # against the real GitHub remote. Pre-copying this checkout (with
          # its .git dir) and pointing ROOTMEDIC_BRANCH at the PR's own head
          # branch makes that reset a no-op landing on the exact commit
          # already checked out above — correct for a same-repo PR. This
          # does not handle PRs from forks (no origin ref for a fork branch);
          # not a concern for this repo's current single-team workflow.
          sudo mkdir -p "$INSTALL_DIR"
          sudo cp -r "$GITHUB_WORKSPACE"/. "$INSTALL_DIR"/

          sudo -E env \
            ROOTMEDIC_NON_INTERACTIVE=1 \
            ROOTMEDIC_BRANCH="$ROOTMEDIC_BRANCH" \
            INSTALL_DIR="$INSTALL_DIR" \
            LOKI_URL="http://localhost:3100" \
            START_LOKI_IF_DOWN=0 \
            LLM_TYPE=external \
            LITELLM_BASE_URL="http://localhost:8080" \
            LITELLM_MODEL=mock-model \
            LITELLM_API_KEY=ci-test-key \
            TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN" \
            TELEGRAM_CHAT_ID="$TELEGRAM_CHAT_ID" \
            ALERT_EMAIL_RELAY_URL="$ALERT_EMAIL_RELAY_URL" \
            ALERT_EMAIL_RELAY_API_KEY="$ALERT_EMAIL_RELAY_API_KEY" \
            ALERT_EMAIL_TO="$ALERT_EMAIL_TO" \
            bash "$INSTALL_DIR/scripts/install.sh"

      - name: Verify the real systemd service is active
        run: |
          # The Docker-based ci/test-install harness stubs systemctl entirely
          # and can never check this — a real GitHub Actions runner has real
          # systemd, so this is a genuine, meaningful check.
          sudo systemctl is-active --quiet rootmedic.service
          echo "rootmedic.service is active."

      - name: Inject fault scenarios and run the agent once
        run: |
          # Pushes 3 synthetic faults into Loki (OOM kill, EXT4 error, nginx
          # crash) and runs a single recommend-only agent pass — the same
          # script an operator runs post-install, not a CI-specific
          # reimplementation of fault injection. Captured to a file so the
          # Telegram-verify step below can grep AlertManager's own printed
          # per-plugin status line out of it.
          sudo NONINTERACTIVE=1 INSTALL_DIR="$INSTALL_DIR" \
            bash "$INSTALL_DIR/scripts/verify_install.sh" 2>&1 | tee /tmp/verify_install_output.log

      - name: Confirm a recommendation was produced
        run: |
          test -f "$INSTALL_DIR/remediation.yaml"
          grep -qE "nginx|mysqld" "$INSTALL_DIR/remediation.yaml"
          echo "remediation.yaml:"
          cat "$INSTALL_DIR/remediation.yaml"

      - name: Verify the email alert actually arrived
        env:
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_RELAY_API_KEY: ${{ secrets.ALERT_EMAIL_RELAY_API_KEY }}
          SINCE: ${{ steps.start.outputs.epoch }}
        run: |
          for i in $(seq 1 12); do
            resp=$(curl -fsS "$ALERT_EMAIL_RELAY_URL/alerts/verify?to=$ALERT_EMAIL_TO&since=$SINCE" \
              -H "Authorization: Bearer $ALERT_EMAIL_RELAY_API_KEY")
            echo "$resp"
            if echo "$resp" | grep -q '"found":true'; then
              echo "Email alert confirmed."
              exit 0
            fi
            sleep 5
          done
          echo "No email alert arrived within the wait window." && exit 1

      - name: Confirm the Telegram alert was actually sent
        run: |
          # AlertManager only prints "sent" once Telegram's sendMessage API
          # itself returned success (alerting.py's send_alert()) — see the
          # header comment for why this, not an independent oracle, is what
          # Telegram verification looks like here.
          grep -q '\[ALERT\]\[telegram\] sent' /tmp/verify_install_output.log
          echo "Telegram alert confirmed sent."

      - name: Clean up
        if: always()
        run: |
          sudo ROOTMEDIC_NON_INTERACTIVE=1 INSTALL_DIR="$INSTALL_DIR" \
            bash "$INSTALL_DIR/scripts/cleanup.sh" || true
          docker rm -f ci-loki ci-mock-llm || true
